services:
  - type: web
    name: dropout-prediction-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run professional_demo.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DROPOUT_EMAIL_FROM
        sync: false
      - key: DROPOUT_EMAIL_PASSWORD
        sync: false
      - key: DROPOUT_MENTOR_EMAIL_SY
        sync: false
      - key: DROPOUT_MENTOR_EMAIL_TY
        sync: false
