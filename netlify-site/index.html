<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="3;url=https://dropout-prediction-kp1h.onrender.com" />
  <title>AI Dropout Prediction and Counselling</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(135deg, #0b3b78 0%, #1e5fa8 50%, #0b3b78 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 48px 56px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
      max-width: 520px;
      width: 90%;
    }

    .icon { font-size: 3.2rem; margin-bottom: 16px; }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    p {
      color: rgba(255,255,255,0.75);
      font-size: 1rem;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      background: #fff;
      color: #0b3b78;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 36px;
      border-radius: 50px;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.3);
    }

    .countdown {
      margin-top: 24px;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.5);
    }

    #secs { font-weight: 700; color: rgba(255,255,255,0.85); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎓</div>
    <h1>AI Dropout Prediction<br>and Counselling</h1>
    <p>Predict student dropout risk using attendance, marks, fees and mentor notes. Powered by machine learning.</p>
    <a class="btn" href="https://dropout-prediction-kp1h.onrender.com">Open Dashboard →</a>
    <p class="countdown">Redirecting automatically in <span id="secs">3</span>s&hellip;</p>
  </div>

  <script>
    var s = 3;
    var el = document.getElementById('secs');
    var t = setInterval(function () {
      s--;
      el.textContent = s;
      if (s <= 0) {
        clearInterval(t);
        window.location.href = 'https://dropout-prediction-kp1h.onrender.com';
      }
    }, 1000);
  </script>
</body>
</html>
